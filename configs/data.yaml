project:
  name: "health-fraud-risk-model"
  random_seed: 42


# =============================================================================
# GLOBAL SIMULATION
# =============================================================================

simulation:
  start_date: "2023-01-01"
  end_date: "2026-06-30"

  n_customers: 20000
  n_providers: 1200
  target_claims: 100000

  seasonality:
    enabled: true

    monthly_factors:
      "01": 1.08
      "02": 1.02
      "03": 1.00
      "04": 0.97
      "05": 0.96
      "06": 0.94
      "07": 0.90
      "08": 0.88
      "09": 1.00
      "10": 1.04
      "11": 1.07
      "12": 1.12


# =============================================================================
# CUSTOMER / PROVIDER POPULATIONS
# =============================================================================

entities:

  customers:

    age:
      distribution: "truncated_normal"
      min: 18
      max: 90
      mean: 46
      std: 17

    tenure_months:
      min: 1
      max: 240

    coverage_levels:
      basic: 0.35
      standard: 0.45
      premium: 0.20

    behavior_segments:
      low_usage: 0.35
      regular: 0.45
      high_usage: 0.17
      atypical: 0.03

    claim_frequency_multiplier:
      low_usage: 0.55
      regular: 1.00
      high_usage: 1.80
      atypical: 2.40


  providers:

    provider_types:
      general_practitioner: 0.20
      specialist: 0.15
      dentist: 0.15
      optician: 0.10
      physiotherapist: 0.12
      pharmacy: 0.15
      laboratory: 0.07
      medical_supplier: 0.04
      other: 0.02

    regions:
      north: 0.20
      south: 0.25
      east: 0.20
      west: 0.20
      central: 0.15

    behavior_segments:
      low_volume: 0.20
      normal: 0.67
      high_volume: 0.10
      atypical: 0.03

    claim_volume_multiplier:
      low_volume: 0.60
      normal: 1.00
      high_volume: 1.70
      atypical: 2.30


# =============================================================================
# HEALTH SERVICES
# =============================================================================

services:

  consultation:
    probability: 0.24

    amount:
      distribution: "lognormal"
      median: 80
      sigma: 0.35
      min: 25
      max: 700

    units:
      min: 1
      max: 2


  dental:
    probability: 0.18

    amount:
      distribution: "lognormal"
      median: 320
      sigma: 0.55
      min: 30
      max: 5000

    units:
      min: 1
      max: 4


  optical:
    probability: 0.12

    amount:
      distribution: "lognormal"
      median: 260
      sigma: 0.45
      min: 40
      max: 2500

    units:
      min: 1
      max: 3


  physiotherapy:
    probability: 0.14

    amount:
      distribution: "lognormal"
      median: 180
      sigma: 0.40
      min: 30
      max: 1600

    units:
      min: 1
      max: 15


  pharmacy:
    probability: 0.16

    amount:
      distribution: "lognormal"
      median: 70
      sigma: 0.50
      min: 5
      max: 1500

    units:
      min: 1
      max: 8


  medical_device:
    probability: 0.06

    amount:
      distribution: "lognormal"
      median: 450
      sigma: 0.60
      min: 50
      max: 8000

    units:
      min: 1
      max: 3


  diagnostic:
    probability: 0.07

    amount:
      distribution: "lognormal"
      median: 140
      sigma: 0.40
      min: 20
      max: 2500

    units:
      min: 1
      max: 5


  other:
    probability: 0.03

    amount:
      distribution: "lognormal"
      median: 120
      sigma: 0.55
      min: 10
      max: 3000

    units:
      min: 1
      max: 5


# =============================================================================
# CLAIM CHARACTERISTICS
# =============================================================================

claims:

  submission_channels:
    mobile_app: 0.35
    web: 0.28
    email: 0.15
    paper: 0.07
    provider_direct: 0.15

  service_to_submission_days:
    distribution: "gamma"
    shape: 2.0
    scale: 4.0
    max_days: 120

  document_count:
    min: 1
    max: 6

  has_invoice_probability: 0.96

  has_prescription_probability:
    consultation: 0.10
    dental: 0.05
    optical: 0.15
    physiotherapy: 0.55
    pharmacy: 0.80
    medical_device: 0.65
    diagnostic: 0.35
    other: 0.20

  claim_amount_noise_std: 0.08


# =============================================================================
# POLICY
# =============================================================================

policy:

  recent_change_probability: 0.08
  recent_change_window_days: 90

  coverage_limits:

    basic:
      consultation: 100
      dental: 500
      optical: 300
      physiotherapy: 350
      pharmacy: 150
      medical_device: 600
      diagnostic: 250
      other: 200

    standard:
      consultation: 150
      dental: 900
      optical: 500
      physiotherapy: 600
      pharmacy: 250
      medical_device: 1000
      diagnostic: 400
      other: 350

    premium:
      consultation: 250
      dental: 1500
      optical: 900
      physiotherapy: 1000
      pharmacy: 400
      medical_device: 1800
      diagnostic: 700
      other: 600


# =============================================================================
# HISTORICAL FEATURES
# =============================================================================

historical_features:

  windows_days:
    - 7
    - 30
    - 90
    - 365

  zero_fill_count_features: true

  customer:
    enabled: true

  provider:
    enabled: true

  customer_provider:
    enabled: true

  service:
    enabled: true


# =============================================================================
# FRAUD SIMULATION V3
# =============================================================================

fraud:

  # Final expected fraud prevalence.
  target_prevalence: 0.025

  # Small amount of unavoidable / imperfect ground-truth noise.
  # Much lower than the former 1%.
  label_flip_probability: 0.001

  difficulty_mix:
    easy: 0.20
    medium: 0.50
    hard: 0.30

  # Fraud mechanisms now represent ACTUAL behavioural injections.
  mechanism_mix:

    amount_inflation: 0.22
    frequency_abuse: 0.20
    provider_abnormality: 0.18
    repeated_service: 0.16
    customer_provider_pattern: 0.14
    mixed_pattern: 0.10


  # ---------------------------------------------------------------------------
  # AMOUNT INFLATION
  # ---------------------------------------------------------------------------

  mechanisms:

    amount_inflation:

      enabled: true

      inflation_factor:

        easy:
          min: 1.80
          max: 3.00

        medium:
          min: 1.35
          max: 2.00

        hard:
          min: 1.10
          max: 1.45

      reimbursement_pressure:

        easy:
          min: 0.90
          max: 1.00

        medium:
          min: 0.82
          max: 0.98

        hard:
          min: 0.72
          max: 0.92


    # -------------------------------------------------------------------------
    # FREQUENCY ABUSE
    # -------------------------------------------------------------------------

    frequency_abuse:

      enabled: true

      episode_size:

        easy:
          min: 5
          max: 8

        medium:
          min: 4
          max: 6

        hard:
          min: 3
          max: 4

      window_days:

        easy: 7
        medium: 14
        hard: 30

      same_service_probability:

        easy: 0.70
        medium: 0.55
        hard: 0.40

      same_provider_probability:

        easy: 0.45
        medium: 0.35
        hard: 0.25


    # -------------------------------------------------------------------------
    # REPEATED SERVICE
    # -------------------------------------------------------------------------

    repeated_service:

      enabled: true

      episode_size:

        easy:
          min: 5
          max: 7

        medium:
          min: 4
          max: 6

        hard:
          min: 3
          max: 4

      window_days:

        easy: 10
        medium: 20
        hard: 30

      same_provider_probability:

        easy: 0.75
        medium: 0.60
        hard: 0.45


    # -------------------------------------------------------------------------
    # PROVIDER ABNORMALITY
    # -------------------------------------------------------------------------

    provider_abnormality:

      enabled: true

      episode_size:

        easy:
          min: 12
          max: 20

        medium:
          min: 8
          max: 14

        hard:
          min: 5
          max: 9

      window_days:

        easy: 14
        medium: 21
        hard: 30

      distinct_customer_fraction:

        easy: 0.80
        medium: 0.70
        hard: 0.60

      amount_multiplier:

        easy:
          min: 1.20
          max: 1.65

        medium:
          min: 1.05
          max: 1.35

        hard:
          min: 0.95
          max: 1.20


    # -------------------------------------------------------------------------
    # CUSTOMER × PROVIDER CONCENTRATION
    # -------------------------------------------------------------------------

    customer_provider_pattern:

      enabled: true

      episode_size:

        easy:
          min: 5
          max: 8

        medium:
          min: 4
          max: 6

        hard:
          min: 3
          max: 4

      window_days:

        easy: 10
        medium: 20
        hard: 30

      same_service_probability:

        easy: 0.70
        medium: 0.55
        hard: 0.40


    # -------------------------------------------------------------------------
    # MIXED FRAUD
    # -------------------------------------------------------------------------

    mixed_pattern:

      enabled: true

      episode_size:

        easy:
          min: 5
          max: 8

        medium:
          min: 4
          max: 6

        hard:
          min: 3
          max: 5

      window_days:

        easy: 10
        medium: 20
        hard: 30

      inflation_factor:

        easy:
          min: 1.55
          max: 2.30

        medium:
          min: 1.25
          max: 1.75

        hard:
          min: 1.08
          max: 1.35

      same_provider_probability:

        easy: 0.85
        medium: 0.70
        hard: 0.55

      same_service_probability:

        easy: 0.80
        medium: 0.65
        hard: 0.50


  # ---------------------------------------------------------------------------
  # EPISODE CONSTRUCTION
  # ---------------------------------------------------------------------------

  episode_generation:

    # Avoid concentrating behavioural fraud at the very beginning
    # where no useful history can yet exist.
    warmup_days: 60

    # Avoid heavy reuse of the same claim across different episodes.
    maximum_claim_reuse: 1

    # A proportion of the first observations inside an episode can remain
    # intrinsically hard because historical evidence has not accumulated yet.
    label_all_episode_claims: true

    # Preserve overlap between legitimate and fraudulent distributions.
    avoid_perfect_separation: true


# =============================================================================
# LEGITIMATE HARD NEGATIVES
# =============================================================================

legitimate_anomalies:

  enabled: true

  prevalence: 0.04

  pattern_mix:

    high_amount_legitimate: 0.30
    high_frequency_legitimate: 0.30
    unusual_provider_legitimate: 0.20
    repeated_service_legitimate: 0.20


  # These are intentionally weaker / overlapping versions of suspicious
  # behaviours and remain labelled as legitimate.

  high_amount_legitimate:

    multiplier:
      min: 1.20
      max: 1.70


  high_frequency_legitimate:

    episode_size:
      min: 2
      max: 4

    window_days:
      min: 14
      max: 30


  unusual_provider_legitimate:

    episode_size:
      min: 3
      max: 6

    window_days:
      min: 14
      max: 30


  repeated_service_legitimate:

    episode_size:
      min: 2
      max: 4

    window_days:
      min: 14
      max: 30


# =============================================================================
# CONCEPT DRIFT
# =============================================================================

concept_drift:

  enabled: true

  start_date: "2025-07-01"

  # Changes should be noticeable but not destroy generalisation.
  mechanism_weight_multiplier:

    amount_inflation: 1.08
    frequency_abuse: 0.92
    provider_abnormality: 1.10
    repeated_service: 1.00
    customer_provider_pattern: 1.08
    mixed_pattern: 1.05

  severity_multiplier: 1.03

  prevalence_multiplier: 1.05


# =============================================================================
# MISSINGNESS
# =============================================================================

missingness:

  enabled: true

  provider_id_probability: 0.01
  prescription_missing_probability: 0.03
  document_count_missing_probability: 0.005


# =============================================================================
# CONTROLLED DATA QUALITY ISSUES
# =============================================================================

quality:

  inject_invalid_records: true

  invalid_record_probability: 0.001

  invalid_record_types:
    negative_amount: 0.34
    zero_units: 0.33
    service_after_submission: 0.33


# =============================================================================
# TEMPORAL SPLITS
# =============================================================================

splits:

  train:
    start_date: "2023-01-01"
    end_date: "2025-06-30"

  validation:
    start_date: "2025-07-01"
    end_date: "2025-12-31"

  test:
    start_date: "2026-01-01"
    end_date: "2026-06-30"


# =============================================================================
# OUTPUT
# =============================================================================

output:

  synthetic_dir: "data/synthetic"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

  format: "parquet"

  files:
    customers: "customers.parquet"
    providers: "providers.parquet"
    policies: "policies.parquet"
    claims: "claims.parquet"