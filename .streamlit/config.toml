[theme]
base = "dark"

primaryColor = "#4C8DFF"
backgroundColor = "#060A12"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"

font = "sans-serif"
baseFontSize = 16

baseRadius = "medium"
buttonRadius = "medium"

borderColor = "#253044"
dataframeBorderColor = "#253044"
dataframeHeaderBackgroundColor = "#0B1220"

showWidgetBorder = true
showSidebarBorder = true

linkColor = "#70A6FF"
linkUnderline = false

codeTextColor = "#DDEBFF"
codeBackgroundColor = "#0B1220"

redColor = "#FF5C7A"
orangeColor = "#FF8A5B"
yellowColor = "#FFD166"
greenColor = "#61E7A6"
blueColor = "#4C8DFF"
violetColor = "#8B5CF6"
grayColor = "#98A6BC"


[theme.sidebar]
primaryColor = "#4C8DFF"
backgroundColor = "#080D18"
secondaryBackgroundColor = "#0B1220"
textColor = "#E8EEF8"

linkColor = "#70A6FF"
linkUnderline = false

codeTextColor = "#DDEBFF"
codeBackgroundColor = "#0B1220"

borderColor = "#1C2636"
dataframeBorderColor = "#1C2636"
dataframeHeaderBackgroundColor = "#0B1220"

showWidgetBorder = true


[server]
headless = true

# Production: disable filesystem watching.
# Prevents watchdog/inotify exhaustion on constrained containers.
fileWatcherType = "none"

runOnSave = false

enableXsrfProtection = true


[browser]
gatherUsageStats = false


[client]
showErrorDetails = "none"
toolbarMode = "minimal"