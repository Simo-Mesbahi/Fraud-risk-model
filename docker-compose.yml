services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: health-fraud-api

    ports:
      - "8000:8000"

    environment:
      PYTHONPATH: ".:src"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s