services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: health-fraud-api

    ports:
      - "8000:8000"

    environment:
      PYTHONPATH: ".:src"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  fraud-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: health-fraud-frontend

    ports:
      - "8501:8501"

    environment:
      FRAUD_API_URL: "http://fraud-api:8000"

    depends_on:
      fraud-api:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s