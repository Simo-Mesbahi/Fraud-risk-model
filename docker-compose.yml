services:

  # ===========================================================================
  # Fraud inference API
  # ===========================================================================

  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: health-fraud-api

    ports:
      - "8000:8000"

    environment:
      PYTHONPATH: ".:src"
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ===========================================================================
  # Investigation frontend
  # ===========================================================================

  fraud-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: health-fraud-frontend

    ports:
      - "8501:8501"

    environment:
      FRAUD_API_URL: "http://fraud-api:8000"
      ARTIFACTS_ROOT: "/app/artifacts"
      APP_ENV: "development"
      PYTHONUNBUFFERED: "1"

    depends_on:
      fraud-api:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s