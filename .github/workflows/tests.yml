name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Python compilation checks
        env:
          PYTHONPATH: .:src
        run: |
          python -m py_compile src/health_fraud/features/build.py
          python -m py_compile src/health_fraud/models/predict.py
          python -m py_compile api/app/main.py
          python -m py_compile api/app/dependencies.py
          python -m py_compile api/app/schemas.py
          python -m py_compile api/app/services/prediction_service.py
          python -m py_compile api/app/routers/healthcheck.py
          python -m py_compile api/app/routers/predictions.py

      - name: Run tests
        env:
          PYTHONPATH: .:src
        run: |
          python -m pytest api/tests tests -v