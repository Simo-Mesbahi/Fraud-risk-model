name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: ".:src"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"


jobs:

  # ===========================================================================
  # Python quality, contracts and tests
  # ===========================================================================

  quality-tests:

    name: Quality & Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # -----------------------------------------------------------------------
      # Repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt


      # -----------------------------------------------------------------------
      # Dependencies
      # -----------------------------------------------------------------------

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel


      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt


      - name: Verify dependency consistency
        run: |
          python -m pip check


      # -----------------------------------------------------------------------
      # Repository diagnostics
      # -----------------------------------------------------------------------

      - name: Show runtime environment
        run: |
          python --version
          python -m pip --version
          echo "PYTHONPATH=${PYTHONPATH}"
          pwd


      # -----------------------------------------------------------------------
      # Artifact presence
      # -----------------------------------------------------------------------

      - name: Validate required model artifacts
        shell: bash
        run: |
          set -euo pipefail

          MODEL_PATH="artifacts/models/health_fraud_xgboost.joblib"
          PREPROCESSOR_PATH="artifacts/preprocessors/health_fraud_preprocessor.joblib"
          METADATA_PATH="artifacts/metadata/health_fraud_model_metadata.json"

          echo "Checking required inference artifacts..."

          for artifact in \
            "$MODEL_PATH" \
            "$PREPROCESSOR_PATH" \
            "$METADATA_PATH"
          do
            if [ ! -f "$artifact" ]; then
              echo "✗ Missing required artifact: $artifact"
              exit 1
            fi

            echo "✓ $artifact"
          done

          echo
          echo "✓ REQUIRED INFERENCE ARTIFACTS: OK"


      # -----------------------------------------------------------------------
      # Artifact readability
      # -----------------------------------------------------------------------

      - name: Validate model artifact loading
        run: |
          python - <<'PY'
          from api.app.dependencies import get_fraud_scorer

          scorer = get_fraud_scorer()

          print("Model:", scorer.model_name)
          print("Version:", scorer.model_version)
          print("Source features:", scorer.feature_count)
          print(
              "Transformed features:",
              len(scorer.transformed_feature_names),
          )

          assert scorer.model_name == "XGBoost"
          assert scorer.model_version == "1.0.0"
          assert scorer.feature_count == 57
          assert len(scorer.transformed_feature_names) == 107

          print("\n✓ MODEL ARTIFACT CONTRACT: OK")
          PY


      # -----------------------------------------------------------------------
      # Static Python validation
      # -----------------------------------------------------------------------

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            src \
            api \
            frontend \
            tests

          echo "✓ PYTHON COMPILATION: OK"


      # -----------------------------------------------------------------------
      # Import contract
      # -----------------------------------------------------------------------

      - name: Validate application imports
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "health_fraud.models.predict",
              "health_fraud.features.build",

              "api.app.main",
              "api.app.dependencies",
              "api.app.schemas",
              "api.app.services.prediction_service",
              "api.app.routers.healthcheck",
              "api.app.routers.predictions",

              "frontend.api_client",
              "frontend.components",
              "frontend.styles",

              "frontend.utils.data",
              "frontend.utils.formatting",
              "frontend.utils.state",
              "frontend.utils.validation",

              "frontend.views.overview",
              "frontend.views.claim_analysis",
              "frontend.views.portfolio_scoring",
              "frontend.views.investigation_queue",
              "frontend.views.model_insights",
              "frontend.views.system_status",
          ]

          for module_name in modules:
              importlib.import_module(module_name)
              print(f"✓ {module_name}")

          print("\n✓ APPLICATION IMPORT CONTRACT: OK")
          PY


      # -----------------------------------------------------------------------
      # Full test suite
      # -----------------------------------------------------------------------

      - name: Run full test suite
        run: |
          python -m pytest \
            tests \
            -q

          echo
          echo "✓ FULL TEST SUITE: OK"


      # -----------------------------------------------------------------------
      # Critical-path coverage
      # -----------------------------------------------------------------------

      - name: Run critical-path coverage
        run: |
          python -m pytest \
            tests \
            --cov=health_fraud.models.predict \
            --cov=health_fraud.features.build \
            --cov=api.app \
            --cov=frontend.api_client \
            --cov=frontend.utils.formatting \
            --cov=frontend.utils.validation \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=75

          echo
          echo "✓ CRITICAL-PATH COVERAGE GATE: OK"


      # -----------------------------------------------------------------------
      # Coverage artifact
      # -----------------------------------------------------------------------

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14


  # ===========================================================================
  # Container reproducibility
  # ===========================================================================

  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    timeout-minutes: 25

    needs:
      - quality-tests

    steps:

      # -----------------------------------------------------------------------
      # Repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Docker environment
      # -----------------------------------------------------------------------

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version


      # -----------------------------------------------------------------------
      # Compose contract
      # -----------------------------------------------------------------------

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet

          echo "✓ DOCKER COMPOSE CONTRACT: OK"


      # -----------------------------------------------------------------------
      # Reproducible image build
      # -----------------------------------------------------------------------

      - name: Build API and frontend images
        run: |
          docker compose build --pull


      # -----------------------------------------------------------------------
      # Start stack
      # -----------------------------------------------------------------------

      - name: Start application stack
        run: |
          docker compose up -d

          docker compose ps


      # -----------------------------------------------------------------------
      # Runtime health validation
      # -----------------------------------------------------------------------

      - name: Wait for containers
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for application containers..."

          for attempt in {1..40}; do

            API_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                health-fraud-api \
                2>/dev/null \
                || true
            )"

            FRONTEND_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                health-fraud-frontend \
                2>/dev/null \
                || true
            )"

            echo \
              "Attempt ${attempt}/40 | API=${API_STATUS:-missing} | Frontend=${FRONTEND_STATUS:-missing}"

            if \
              [ "$API_STATUS" = "healthy" ] \
              && [ "$FRONTEND_STATUS" = "healthy" ]
            then
              echo
              echo "✓ BOTH CONTAINERS ARE HEALTHY"
              exit 0
            fi

            if \
              [ "$API_STATUS" = "unhealthy" ] \
              || [ "$FRONTEND_STATUS" = "unhealthy" ]
            then
              echo
              echo "✗ A container became unhealthy."

              docker compose ps
              docker compose logs --tail=250

              exit 1
            fi

            sleep 5
          done

          echo
          echo "✗ Timed out waiting for healthy containers."

          docker compose ps
          docker compose logs --tail=250

          exit 1


      # -----------------------------------------------------------------------
      # API smoke tests
      # -----------------------------------------------------------------------

      - name: Smoke test API health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:8000/health

          echo
          echo "✓ API HEALTH ENDPOINT: OK"


      - name: Smoke test API model contract
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:8000/model-info

          echo
          echo "✓ API MODEL CONTRACT ENDPOINT: OK"


      # -----------------------------------------------------------------------
      # Frontend smoke test
      # -----------------------------------------------------------------------

      - name: Smoke test frontend
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:8501/_stcore/health

          echo
          echo "✓ STREAMLIT HEALTH ENDPOINT: OK"


      # -----------------------------------------------------------------------
      # Container runtime validation
      # -----------------------------------------------------------------------

      - name: Validate container runtime state
        shell: bash
        run: |
          set -euo pipefail

          API_RUNNING="$(
            docker inspect \
              --format='{{.State.Running}}' \
              health-fraud-api
          )"

          FRONTEND_RUNNING="$(
            docker inspect \
              --format='{{.State.Running}}' \
              health-fraud-frontend
          )"

          test "$API_RUNNING" = "true"
          test "$FRONTEND_RUNNING" = "true"

          echo "✓ API container running"
          echo "✓ Frontend container running"


      # -----------------------------------------------------------------------
      # Runtime status
      # -----------------------------------------------------------------------

      - name: Show final container status
        run: |
          docker compose ps


      # -----------------------------------------------------------------------
      # Diagnostics
      # -----------------------------------------------------------------------

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "========================================"
          echo " Docker Compose Status"
          echo "========================================"

          docker compose ps || true

          echo
          echo "========================================"
          echo " Docker Logs"
          echo "========================================"

          docker compose logs --tail=300 || true


      # -----------------------------------------------------------------------
      # Cleanup
      # -----------------------------------------------------------------------

      - name: Stop application stack
        if: always()
        run: |
          docker compose down \
            --remove-orphans \
            --volumes
